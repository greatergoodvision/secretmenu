name: Sync secret menu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'public/index.html'
      - '.github/workflows/**'
      - 'package.json'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: secretmenu-media-only
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Sync media-backed catalog
        env:
          AIRTABLE_SOURCE_URL: ${{ secrets.AIRTABLE_SOURCE_URL }}
        run: |
          node scripts/sync.mjs
          node scripts/filter-media.mjs
      - name: Save refreshed catalog
        run: |
          git config user.name 'secretmenu-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/catalog.json public/images || true
          git diff --cached --quiet || git commit -m 'Refresh media-only catalog'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test live sites
        run: node scripts/smoke.mjs
