name: Sync secret menu

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'public/index.html'
      - '.github/workflows/**'
      - 'package.json'
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: secretmenu-media-v2
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Sync public catalog
        env:
          AIRTABLE_SOURCE_URL: ${{ secrets.AIRTABLE_SOURCE_URL }}
        run: |
          node <<'NODE'
          const fs=require('fs');
          const p='scripts/sync.mjs';
          let s=fs.readFileSync(p,'utf8');
          s=s.replace("const parent = thumb.locator('xpath=' + '../'.repeat(up));","const parent = thumb.locator('xpath=..');");
          s=s.replace("timeout: 5000,","timeout: 1200,");
          s=s.replace("for (const u of candidates.slice(0, 40)) {","if (!globalThis.__ppVideoCandidatesLogged) { globalThis.__ppVideoCandidatesLogged=true; console.log('VIDEO_CANDIDATES='+JSON.stringify(candidates.slice(0,30).map(x=>{try{const u=new URL(x);return u.origin+u.pathname}catch{return x}}))); }\n    for (const u of candidates.filter(u=>/airtable|airtableusercontent|amazonaws|cloudfront|usercontent|storage/i.test(u)).slice(0, 12)) {");
          fs.writeFileSync(p,s);
          NODE
          node scripts/sync.mjs
      - name: Save refreshed catalog
        run: |
          git config user.name 'secretmenu-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/catalog.json public/images || true
          git diff --cached --quiet || git commit -m 'Refresh catalog'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Smoke test live sites
        run: node scripts/smoke.mjs
