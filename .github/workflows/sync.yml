name: Sync secret menu

on:
  workflow_dispatch:
  schedule:
    - cron: '17 * * * *'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: secretmenu
  cancel-in-progress: true

jobs:
  sync-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r requirements.txt
      - name: Sync public catalog
        env:
          AIRTABLE_SOURCE_URL: ${{ secrets.AIRTABLE_SOURCE_URL }}
        run: python scripts/sync.py
      - name: Save refreshed catalog
        run: |
          git config user.name 'secretmenu-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add public/catalog.json public/images || true
          git diff --cached --quiet || git commit -m 'Refresh catalog'
          git push
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
