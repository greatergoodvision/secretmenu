name: Diagnose Airtable media

on:
  push:
    branches: [main]
    paths:
      - 'scripts/diagnose-media.mjs'
      - '.github/workflows/diagnose-media.yml'

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install
      - run: npx playwright install --with-deps chromium
      - name: Inspect Airtable attachment viewer
        env:
          AIRTABLE_SOURCE_URL: ${{ secrets.AIRTABLE_SOURCE_URL }}
        run: node scripts/diagnose-media.mjs
