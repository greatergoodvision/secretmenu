<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#060606">
<title>Pounds Paradise | Pounds District</title>
<script>
if (location.hostname === 'greatergoodvision.github.io') {
  location.replace('https://menu.poundsdistrict.com/menu' + location.search + location.hash);
}
</script>
<style>
:root{--bg:#060606;--panel:#111;--line:#242424;--text:#f7f7f7;--muted:#888;--red:#e31b23;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}body{min-height:100vh;background:radial-gradient(circle at 85% -5%,rgba(227,27,35,.16),transparent 28%),linear-gradient(180deg,#0a0a0a,#050505 45%,#020202)}.wrap{width:min(1440px,100%);margin:auto;padding:0 24px 70px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;margin:0 -24px;padding:14px 24px;background:rgba(5,5,5,.88);backdrop-filter:blur(16px);border-bottom:1px solid #181818}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;color:#fff}.bar{width:5px;height:30px;border-radius:99px;background:var(--red);box-shadow:0 0 22px rgba(227,27,35,.35)}.b1{font-size:12px;font-weight:950;letter-spacing:.22em;text-transform:uppercase}.b2{margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.25em;text-transform:uppercase;color:#777}.live{font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:#aaa}.live:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--red);box-shadow:0 0 16px rgba(227,27,35,.8)}.hero{padding:56px 0 30px;border-bottom:1px solid #1b1b1b}.kick{font-size:11px;color:#ff525b;font-weight:900;letter-spacing:.25em;text-transform:uppercase;margin-bottom:15px}h1{font-size:clamp(54px,9vw,128px);line-height:.82;letter-spacing:-.065em;margin:0;font-weight:950}.rule{width:min(220px,40vw);height:5px;background:var(--red);border-radius:99px;margin-top:25px}.herofoot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:24px;color:#888;font-size:13px}.controls{position:sticky;top:58px;z-index:15;display:grid;grid-template-columns:1fr 240px;gap:10px;margin:22px 0 14px;padding:9px;background:rgba(14,14,14,.92);border:1px solid #222;border-radius:16px;backdrop-filter:blur(14px)}input,select{width:100%;height:50px;border-radius:11px;border:1px solid #282828;background:#090909;color:#fff;padding:0 15px;font-size:15px;outline:none}input:focus,select:focus{border-color:#7d171b}.meta{margin:0 2px 20px;color:#777;font-size:12px}.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:15px}.card{overflow:hidden;border-radius:17px;background:linear-gradient(180deg,#171717,#0f0f0f);border:1px solid #222;box-shadow:0 18px 50px rgba(0,0,0,.36)}.media{position:relative;background:#151515}.photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}.ph{aspect-ratio:4/3;display:grid;place-items:center;color:#555;font-size:10px;letter-spacing:.16em;text-transform:uppercase;background:radial-gradient(circle at 50% 25%,#222,#101010 65%)}.badges{position:absolute;inset:11px 11px auto;display:flex;justify-content:space-between;gap:8px}.badge{padding:6px 9px;border-radius:99px;background:rgba(5,5,5,.83);border:1px solid #353535;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}.quality{color:#ff6b73;border-color:#5a2326}.body{padding:17px}.name{font-size:19px;line-height:1.1;font-weight:900;min-height:42px;margin-bottom:15px}.prices{border-top:1px solid #242424}.price{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid #202020}.price:last-child{border-bottom:0}.pl{font-size:10px;color:#737373;text-transform:uppercase;letter-spacing:.1em;font-weight:800}.pv{font-size:17px;font-weight:950}.empty{grid-column:1/-1;text-align:center;padding:80px 20px;border:1px dashed #2a2a2a;border-radius:17px;color:#707070}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:22px;margin-top:35px;border-top:1px solid #181818;font-size:11px;color:#646464}.foot a{color:#888;text-decoration:none}@media(max-width:1100px){.grid{grid-template-columns:repeat(3,1fr)}}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.controls{grid-template-columns:1fr 200px}}@media(max-width:620px){.wrap{padding:0 14px 50px}.top{margin:0 -14px;padding:12px 14px}.controls{top:51px;grid-template-columns:1fr}.grid{grid-template-columns:1fr}h1{font-size:clamp(52px,18vw,86px)}.hero{padding-top:40px}.name{min-height:0;font-size:21px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="brand" href="https://menu.poundsdistrict.com/"><span class="bar"></span><span><div class="b1">Pounds District</div><div class="b2">Pounds Paradise</div></span></a><div class="live">Live Menu</div></header>
<section class="hero"><div class="kick">Private wholesale access</div><h1>LIVE<br>MENU</h1><div class="rule"></div><div class="herofoot"><span>Current inventory. Updated automatically.</span><strong id="heroCount">Loading inventory…</strong></div></section>
<div class="controls"><input id="search" placeholder="Search inventory…" autocomplete="off"><select id="quality"><option value="">All quality</option></select></div>
<div id="meta" class="meta">Loading current catalog…</div><main id="grid" class="grid"></main>
<footer class="foot"><span>Availability can change between refreshes.</span><a href="https://menu.poundsdistrict.com/">← Pounds Paradise</a></footer>
</div>
<script>
const grid=document.getElementById('grid'),meta=document.getElementById('meta'),heroCount=document.getElementById('heroCount'),search=document.getElementById('search'),quality=document.getElementById('quality');let products=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const field=(p,l)=>(p.fields||[]).find(f=>f.label===l)?.value||'';
const prices=p=>(p.fields||[]).filter(f=>f.kind==='price');
const title=t=>String(t||'').replace(/\s*\([A-Z0-9-]{4,}\)\s*$/i,'').trim()||String(t||'');
const tier=l=>String(l||'').replace('Tier A1 Price','1–10 lbs').replace('Tier B1 Price','10–50 lbs').replace('Tier C1 Price','50+ lbs').replace(/\s*\([^)]*\)/,'');
function render(){const q=search.value.trim().toLowerCase(),qual=quality.value;const list=products.filter(p=>{const pq=field(p,'Quality');return(!q||(p.title+' '+title(p.title)+' '+pq).toLowerCase().includes(q))&&(!qual||pq===qual)});grid.innerHTML=list.length?list.map(p=>{const pq=field(p,'Quality'),qty=field(p,'Quantity Available'),ps=prices(p);const img=p.image?`<img class="photo" loading="lazy" src="${esc(p.image)}" alt="${esc(title(p.title))}" onerror="this.outerHTML='<div class=&quot;ph&quot;>Image unavailable</div>'">`:'<div class="ph">Image unavailable</div>';return`<article class="card"><div class="media">${img}<div class="badges">${pq?`<span class="badge quality">${esc(pq)}</span>`:'<span></span>'}${qty?`<span class="badge">${esc(qty)} lbs</span>`:''}</div></div><div class="body"><div class="name">${esc(title(p.title))}</div><div class="prices">${ps.map(f=>`<div class="price"><span class="pl">${esc(tier(f.label))}</span><span class="pv">${esc(f.value)}</span></div>`).join('')}</div></div></article>`}).join(''):'<div class="empty">Nothing matches that search.</div>';meta.textContent=`${list.length===products.length?products.length:list.length+' of '+products.length} products`}
search.addEventListener('input',render);quality.addEventListener('change',render);
fetch('catalog.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{products=d.products||[];const qs=[...new Set(products.map(p=>field(p,'Quality')).filter(Boolean))].sort();quality.innerHTML='<option value="">All quality</option>'+qs.map(q=>`<option value="${esc(q)}">${esc(q)}</option>`).join('');heroCount.textContent=`${products.length} products live`;const imgs=products.filter(p=>p.image).length,when=d.updatedAt?new Date(d.updatedAt).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'';meta.textContent=`${products.length} products • ${imgs} photos${when?' • Updated '+when:''}`;render()}).catch(()=>{heroCount.textContent='Inventory temporarily unavailable';meta.textContent='Catalog unavailable';grid.innerHTML='<div class="empty">Please check back shortly.</div>'});
</script>
</body>
</html>
