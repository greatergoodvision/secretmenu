<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#050505">
<title>Pounds Paradise | Live Wholesale Menu</title>
<script>
if (location.hostname === 'greatergoodvision.github.io') {
  location.replace('https://menu.poundsdistrict.com/menu' + location.search + location.hash);
}
</script>
<style>
:root{--bg:#050505;--panel:#0d0d0d;--text:#f8f8f8;--muted:#858585;--red:#e31b23;--red2:#ff4b55;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}
body{min-height:100vh;background:radial-gradient(circle at 88% -8%,rgba(227,27,35,.16),transparent 30%),radial-gradient(circle at 10% 20%,rgba(100,0,5,.08),transparent 28%),linear-gradient(180deg,#090909 0,#050505 44%,#020202 100%)}
button,input,select{font:inherit}button{color:inherit}.wrap{width:min(1500px,100%);margin:auto;padding:0 24px 72px}
.top{position:sticky;top:0;z-index:40;display:flex;align-items:center;justify-content:space-between;gap:18px;margin:0 -24px;padding:14px 24px;background:rgba(5,5,5,.88);backdrop-filter:blur(18px) saturate(135%);border-bottom:1px solid #171717}
.brand{display:flex;gap:11px;align-items:center;background:none;border:0;padding:0;cursor:pointer;text-align:left}.bar{width:5px;height:30px;border-radius:99px;background:var(--red);box-shadow:0 0 22px rgba(227,27,35,.4)}
.b1{font-size:12px;font-weight:950;letter-spacing:.22em;text-transform:uppercase}.b2{margin-top:4px;font-size:9px;font-weight:850;letter-spacing:.25em;text-transform:uppercase;color:#747474}
.live{font-size:10px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#aaa}.live:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--red);box-shadow:0 0 18px rgba(227,27,35,.85)}
.homeHero{padding:74px 0 40px}.kick{font-size:11px;color:var(--red2);font-weight:950;letter-spacing:.28em;text-transform:uppercase;margin-bottom:16px}
.homeHero h1,.categoryHero h1{margin:0;font-weight:950;letter-spacing:-.065em}.homeHero h1{font-size:clamp(58px,9vw,132px);line-height:.82;max-width:1100px}
.rule{width:min(220px,40vw);height:5px;background:var(--red);border-radius:99px;margin-top:27px;box-shadow:0 0 26px rgba(227,27,35,.25)}
.homeSub{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:25px;color:#888;font-size:14px}.homeSub strong{color:#fff}
.sectionHead{display:flex;justify-content:space-between;align-items:end;gap:20px;margin:8px 0 18px}.sectionHead h2{margin:0;font-size:22px;letter-spacing:-.025em}.sectionHead span{color:#777;font-size:12px}
.categories{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.categoryCard{position:relative;min-height:250px;overflow:hidden;border:1px solid #262626;border-radius:22px;background:#101010;cursor:pointer;text-align:left;padding:0;box-shadow:0 18px 54px rgba(0,0,0,.32);transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease}
.categoryCard:hover{transform:translateY(-3px);border-color:rgba(227,27,35,.48);box-shadow:0 24px 70px rgba(0,0,0,.5)}.categoryCard.all{grid-column:1/-1;min-height:300px}
.categoryBg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:saturate(.84) contrast(1.08) brightness(.58);transform:scale(1.02);transition:transform .45s ease,filter .3s ease}
.categoryCard:hover .categoryBg{transform:scale(1.05);filter:saturate(.95) contrast(1.08) brightness(.64)}
.categoryShade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(0,0,0,.9) 0%,rgba(0,0,0,.5) 58%,rgba(0,0,0,.2) 100%)}
.categoryContent{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:flex-end;padding:28px}.categoryEyebrow{font-size:10px;font-weight:900;letter-spacing:.17em;text-transform:uppercase;color:#b5b5b5;margin-bottom:8px}
.categoryName{font-size:clamp(32px,4vw,58px);line-height:.92;font-weight:950;letter-spacing:-.045em;max-width:720px}
.categoryBottom{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-top:19px;padding-top:15px;border-top:1px solid rgba(255,255,255,.2)}
.categoryCount{font-size:12px;color:#ddd;font-weight:800}.arrow{width:39px;height:39px;border-radius:50%;display:grid;place-items:center;background:var(--red);font-size:20px;font-weight:800;box-shadow:0 0 24px rgba(227,27,35,.25)}
.categoryView{display:none}.categoryView.active{display:block}.homeView.hidden{display:none}
.categoryHero{padding:40px 0 25px;border-bottom:1px solid #1c1c1c}.back{display:inline-flex;align-items:center;gap:8px;background:none;border:0;padding:0;margin-bottom:18px;color:#9c9c9c;font-size:12px;font-weight:850;letter-spacing:.08em;text-transform:uppercase;cursor:pointer}.back:hover{color:#fff}
.categoryHero h1{font-size:clamp(44px,7vw,88px);line-height:.88}.categoryHeroFoot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:17px;color:#7f7f7f;font-size:13px}
.controls{position:sticky;top:58px;z-index:30;display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:10px;margin:18px 0 13px;padding:9px;background:rgba(13,13,13,.92);border:1px solid #222;border-radius:16px;backdrop-filter:blur(16px);box-shadow:0 12px 35px rgba(0,0,0,.25)}
input,select{width:100%;height:50px;border-radius:11px;border:1px solid #282828;background:#080808;color:#fff;padding:0 15px;font-size:14px;outline:none}input::placeholder{color:#5c5c5c}input:focus,select:focus{border-color:#7d171b;box-shadow:0 0 0 3px rgba(227,27,35,.07)}
.meta{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 2px 16px;color:#747474;font-size:12px}.meta strong{color:#eee}.dotSep{opacity:.45}
.list{display:flex;flex-direction:column;gap:11px}
.product{display:grid;grid-template-columns:minmax(310px,440px) minmax(230px,1fr) minmax(165px,230px);gap:20px;align-items:center;padding:12px;border:1px solid #222;border-radius:18px;background:linear-gradient(180deg,#141414,#0c0c0c);box-shadow:0 13px 38px rgba(0,0,0,.24);transition:border-color .18s ease,transform .18s ease}
.product:hover{border-color:#363636;transform:translateY(-1px)}.mediaStrip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.mediaBtn{position:relative;overflow:hidden;display:block;width:100%;padding:0;border:1px solid #282828;border-radius:12px;background:#0a0a0a;aspect-ratio:4/3;cursor:pointer}
.mediaBtn img{display:block;width:100%;height:100%;object-fit:cover;transition:transform .3s ease,filter .2s ease}.mediaBtn:hover img{transform:scale(1.035);filter:brightness(1.08)}
.mediaTag{position:absolute;left:7px;bottom:7px;padding:4px 6px;border-radius:99px;background:rgba(0,0,0,.76);border:1px solid rgba(255,255,255,.12);font-size:8px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#ddd;pointer-events:none}
.play{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none}.play span{width:42px;height:42px;border-radius:50%;display:grid;place-items:center;padding-left:3px;background:rgba(227,27,35,.92);font-size:17px;box-shadow:0 8px 24px rgba(0,0,0,.35)}
.info{min-width:0}.name{font-size:clamp(23px,2.2vw,32px);line-height:1.01;font-weight:950;letter-spacing:-.035em;margin-bottom:13px}.badges{display:flex;flex-wrap:wrap;gap:7px}
.badge{padding:6px 9px;border-radius:99px;background:#080808;border:1px solid #303030;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#bcbcbc}.quality{color:#ff7279;border-color:#5a2326}
.profile{margin-top:13px;padding-top:12px;border-top:1px solid #222}.profileLine{font-size:11px;line-height:1.55;color:#aaa}.profileLine+.profileLine{margin-top:3px}.profileLabel{color:#696969;font-size:9px;font-weight:900;letter-spacing:.11em;text-transform:uppercase;margin-right:6px}.profileText{margin-top:8px;font-size:12px;line-height:1.48;color:#c4c4c4}.sourceCount{margin-top:8px;font-size:9px;color:#5f5f5f;letter-spacing:.06em;text-transform:uppercase}
.priceBlock{display:flex;flex-direction:column;align-items:flex-end;justify-content:center;min-height:105px;padding:8px 12px 8px 20px;border-left:1px solid #242424;text-align:right}.priceValue{font-size:clamp(28px,3vw,43px);line-height:.95;font-weight:950;letter-spacing:-.045em}.priceUnit{margin-top:8px;font-size:9px;font-weight:900;letter-spacing:.16em;text-transform:uppercase;color:#777}
.empty{text-align:center;padding:76px 20px;border:1px dashed #292929;border-radius:18px;color:#707070}
.modal{position:fixed;inset:0;z-index:100;display:none;align-items:center;justify-content:center;padding:28px;background:rgba(0,0,0,.92);backdrop-filter:blur(10px)}.modal.open{display:flex}
.modalContent{position:relative;width:min(1100px,100%);max-height:90vh;display:flex;align-items:center;justify-content:center}.modalContent img,.modalContent video{display:block;max-width:100%;max-height:88vh;border-radius:14px;background:#000;box-shadow:0 25px 90px rgba(0,0,0,.65)}
.closeModal{position:fixed;right:22px;top:22px;width:45px;height:45px;border:1px solid #333;border-radius:50%;background:#111;color:#fff;font-size:22px;cursor:pointer;z-index:101}.closeModal:hover{background:#1c1c1c}
.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:22px;margin-top:35px;border-top:1px solid #181818;font-size:11px;color:#646464}.foot button{border:0;background:none;padding:0;color:#929292;cursor:pointer}.foot button:hover{color:#fff}
@media(max-width:1000px){.product{grid-template-columns:minmax(280px,390px) 1fr}.priceBlock{grid-column:2;border-left:0;border-top:1px solid #222;align-items:flex-start;text-align:left;padding:14px 0 2px;min-height:0}.mediaStrip{grid-row:1 / span 2}}
@media(max-width:720px){.wrap{padding:0 14px 54px}.top{margin:0 -14px;padding:12px 14px}.b1{font-size:10px}.b2{font-size:8px}.bar{height:27px}.live{font-size:9px}.homeHero{padding:48px 0 30px}.homeHero h1{font-size:clamp(52px,17vw,86px)}.categories{grid-template-columns:1fr}.categoryCard,.categoryCard.all{grid-column:auto;min-height:220px}.categoryCard.all{min-height:245px}.categoryContent{padding:22px}.categoryName{font-size:38px}.categoryHero{padding:31px 0 22px}.controls{top:51px;grid-template-columns:1fr;margin-top:14px}.product{grid-template-columns:1fr;gap:12px;padding:10px}.mediaStrip{grid-row:auto}.mediaBtn{aspect-ratio:1/1}.info{padding:2px 2px 0}.name{font-size:25px}.priceBlock{grid-column:auto;align-items:flex-start;text-align:left;border-left:0;border-top:1px solid #222;padding:14px 2px 3px}.priceValue{font-size:34px}.modal{padding:12px}.closeModal{right:12px;top:12px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><button class="brand" id="brandHome" aria-label="Back to categories"><span class="bar"></span><span><div class="b1">Pounds District</div><div class="b2">Pounds Paradise</div></span></button><div class="live">Live Menu</div></header>

<main id="homeView" class="homeView">
<section class="homeHero"><div class="kick">Private wholesale showroom</div><h1>SHOP THE<br>MENU</h1><div class="rule"></div><div class="homeSub"><span>Choose a category or browse everything.</span><strong id="homeCount">Loading inventory…</strong></div></section>
<div class="sectionHead"><h2>Browse inventory</h2><span id="updatedHome"></span></div>
<section id="categories" class="categories"></section>
</main>

<main id="categoryView" class="categoryView">
<section class="categoryHero"><button id="backCategories" class="back">← Categories</button><div class="kick">Live inventory</div><h1 id="categoryTitle">ALL PRODUCTS</h1><div class="categoryHeroFoot"><span id="categorySub">Current inventory.</span><strong id="categoryCount"></strong></div></section>
<div class="controls"><input id="search" placeholder="Search strains…" autocomplete="off" inputmode="search"><select id="sort" aria-label="Sort products"><option value="az">A–Z</option><option value="za">Z–A</option><option value="price-low">Price: Low → High</option><option value="price-high">Price: High → Low</option><option value="qty-high">Availability: High → Low</option></select></div>
<div id="meta" class="meta"></div><section id="list" class="list"></section>
</main>

<footer class="foot"><span>Availability can change between refreshes.</span><button id="footerCategories">Browse categories ↑</button></footer>
</div>

<div id="modal" class="modal" role="dialog" aria-modal="true" aria-label="Product media"><button id="closeModal" class="closeModal" aria-label="Close media">×</button><div id="modalContent" class="modalContent"></div></div>

<script>
const homeView=document.getElementById('homeView'),categoryView=document.getElementById('categoryView'),categoriesEl=document.getElementById('categories'),listEl=document.getElementById('list'),meta=document.getElementById('meta'),search=document.getElementById('search'),sort=document.getElementById('sort'),homeCount=document.getElementById('homeCount'),updatedHome=document.getElementById('updatedHome'),categoryTitle=document.getElementById('categoryTitle'),categoryCount=document.getElementById('categoryCount'),categorySub=document.getElementById('categorySub'),modal=document.getElementById('modal'),modalContent=document.getElementById('modalContent');
let products=[],activeCategory=null,updatedAt='',strainDetails={};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const field=(p,l)=>(p.fields||[]).find(f=>f.label===l)?.value||'';
const displayTitle=t=>String(t||'').replace(/\s*\([A-Z0-9-]{4,}\)\s*$/i,'').trim()||String(t||'');
const firstPrice=p=>(p.fields||[]).find(f=>f.label.includes('Tier A1 Price'))?.value||(p.fields||[]).find(f=>f.kind==='price')?.value||'';
const money=p=>Number(String(firstPrice(p)).replace(/[^0-9.]/g,''))||0;
const qty=p=>Number(String(field(p,'Quantity Available')).replace(/[^0-9.]/g,''))||0;
const quality=p=>field(p,'Quality')||'Uncategorized';
const mediaFor=p=>(Array.isArray(p.media)?p.media:[]).filter(m=>m&&m.src).slice(0,3);
const qualityOrder=['Lows','Standard','Premium','AAA Exotic','AAA Premium Exotic'];
const profileKey=t=>displayTitle(t).replace(/\s+(Big|Med|Small)$/i,'').trim();
const profileFor=p=>strainDetails[profileKey(p.title)]||null;

function openModal(m,name){if(!m?.src)return;modalContent.innerHTML=m.type==='video'?'<video src="'+esc(m.src)+'" poster="'+esc(m.poster||'')+'" controls autoplay playsinline></video>':'<img src="'+esc(m.src)+'" alt="'+esc(name)+'">';modal.classList.add('open');document.body.style.overflow='hidden'}
function closeModal(){modal.classList.remove('open');modalContent.innerHTML='';document.body.style.overflow=''}
document.getElementById('closeModal').addEventListener('click',closeModal);modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal()});

function mediaMarkup(p){const name=displayTitle(p.title);return mediaFor(p).map((m,i)=>{const tag=m.type==='video'?'Video':'Photo '+(i+1),poster=m.type==='video'?(m.poster||p.image||''):m.src;return '<button class="mediaBtn" data-product="'+esc(p.title)+'" data-media="'+i+'" aria-label="Open '+esc(tag)+' for '+esc(name)+'"><img loading="lazy" src="'+esc(poster)+'" alt="'+esc(name)+' '+esc(tag)+'">'+(m.type==='video'?'<span class="play"><span>▶</span></span>':'')+'<span class="mediaTag">'+esc(tag)+'</span></button>'}).join('')}
function profileMarkup(p){const d=profileFor(p);if(!d)return '';const lines=[['Type',d.type],['Flavor',d.flavor],['Nose',d.nose],['Lineage',d.lineage]].filter(x=>x[1]);return '<div class="profile">'+lines.map(x=>'<div class="profileLine"><span class="profileLabel">'+esc(x[0])+'</span>'+esc(x[1])+'</div>').join('')+(d.profile?'<div class="profileText">'+esc(d.profile)+'</div>':'')+(Array.isArray(d.sources)&&d.sources.length?'<div class="sourceCount">Cross-referenced from '+d.sources.length+' source'+(d.sources.length===1?'':'s')+'</div>':'')+'</div>'}
function productMarkup(p){const q=quality(p),available=field(p,'Quantity Available'),price=firstPrice(p);return '<article class="product"><div class="mediaStrip">'+mediaMarkup(p)+'</div><div class="info"><div class="name">'+esc(displayTitle(p.title))+'</div><div class="badges"><span class="badge quality">'+esc(q)+'</span>'+(available?'<span class="badge">'+esc(available)+' lbs available</span>':'')+'</div>'+profileMarkup(p)+'</div><div class="priceBlock"><div class="priceValue">'+esc(price)+'</div><div class="priceUnit">per lb</div></div></article>'}
function currentBase(){return activeCategory?products.filter(p=>quality(p)===activeCategory):products.slice()}
function renderProducts(){const q=search.value.trim().toLowerCase();let rows=currentBase().filter(p=>!q||(displayTitle(p.title)+' '+quality(p)).toLowerCase().includes(q));switch(sort.value){case'za':rows.sort((a,b)=>displayTitle(b.title).localeCompare(displayTitle(a.title)));break;case'price-low':rows.sort((a,b)=>money(a)-money(b)||displayTitle(a.title).localeCompare(displayTitle(b.title)));break;case'price-high':rows.sort((a,b)=>money(b)-money(a)||displayTitle(a.title).localeCompare(displayTitle(b.title)));break;case'qty-high':rows.sort((a,b)=>qty(b)-qty(a)||displayTitle(a.title).localeCompare(displayTitle(b.title)));break;default:rows.sort((a,b)=>displayTitle(a.title).localeCompare(displayTitle(b.title)))}listEl.innerHTML=rows.length?rows.map(productMarkup).join(''):'<div class="empty">Nothing matches that search.</div>';const total=currentBase().length;meta.innerHTML='<strong>'+rows.length+' '+(rows.length===1?'product':'products')+'</strong>'+(rows.length!==total?'<span class="dotSep">•</span><span>'+total+' in this category</span>':'')+(updatedAt?'<span class="dotSep">•</span><span>Updated '+esc(updatedAt)+'</span>':'');document.querySelectorAll('.mediaBtn').forEach(btn=>btn.addEventListener('click',()=>{const p=products.find(x=>x.title===btn.dataset.product),m=mediaFor(p)[Number(btn.dataset.media)];openModal(m,displayTitle(p?.title))}))}

function showCategories(push=true){activeCategory=null;homeView.classList.remove('hidden');categoryView.classList.remove('active');search.value='';sort.value='az';if(push)history.pushState({},'',location.pathname);window.scrollTo({top:0,behavior:'instant'})}
function showCategory(category,push=true){activeCategory=category==='all'?null:category;homeView.classList.add('hidden');categoryView.classList.add('active');categoryTitle.textContent=activeCategory||'ALL PRODUCTS';const total=currentBase().length;categoryCount.textContent=total+' '+(total===1?'strain':'strains');categorySub.textContent=activeCategory?'Live selections in this category.':'Every live strain in one place.';search.value='';sort.value='az';if(push){const url=new URL(location.href);url.search='';url.searchParams.set('category',activeCategory||'all');history.pushState({},'',url.pathname+url.search)}renderProducts();window.scrollTo({top:0,behavior:'instant'})}

function renderCategories(){const counts={};products.forEach(p=>counts[quality(p)]=(counts[quality(p)]||0)+1);const ordered=[...qualityOrder.filter(q=>counts[q]),...Object.keys(counts).filter(q=>!qualityOrder.includes(q)).sort()];const heroImg=products[0]?.image||'';const allCard='<button class="categoryCard all" data-category="all">'+(heroImg?'<img class="categoryBg" src="'+esc(heroImg)+'" alt="">':'')+'<span class="categoryShade"></span><span class="categoryContent"><span class="categoryEyebrow">Everything currently live</span><span class="categoryName">ALL PRODUCTS</span><span class="categoryBottom"><span class="categoryCount">'+products.length+' strains</span><span class="arrow">→</span></span></span></button>';const cards=ordered.map(q=>{const sample=products.find(p=>quality(p)===q);return '<button class="categoryCard" data-category="'+esc(q)+'">'+(sample?.image?'<img class="categoryBg" src="'+esc(sample.image)+'" alt="">':'')+'<span class="categoryShade"></span><span class="categoryContent"><span class="categoryEyebrow">Browse category</span><span class="categoryName">'+esc(q.toUpperCase())+'</span><span class="categoryBottom"><span class="categoryCount">'+counts[q]+' '+(counts[q]===1?'strain':'strains')+'</span><span class="arrow">→</span></span></span></button>'}).join('');categoriesEl.innerHTML=allCard+cards;categoriesEl.querySelectorAll('.categoryCard').forEach(btn=>btn.addEventListener('click',()=>showCategory(btn.dataset.category)))}

search.addEventListener('input',renderProducts);sort.addEventListener('change',renderProducts);document.getElementById('backCategories').addEventListener('click',()=>showCategories());document.getElementById('footerCategories').addEventListener('click',()=>showCategories());document.getElementById('brandHome').addEventListener('click',()=>showCategories());
window.addEventListener('popstate',()=>{const c=new URLSearchParams(location.search).get('category');if(c)showCategory(c,false);else showCategories(false)});

Promise.all([
  fetch('catalog.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('catalog unavailable');return r.json()}),
  fetch('strain-details.json?ts='+Date.now(),{cache:'no-store'}).then(r=>r.ok?r.json():{profiles:{}}).catch(()=>({profiles:{}}))
]).then(([d,details])=>{products=d.products||[];strainDetails=details.profiles||{};updatedAt=d.updatedAt?new Date(d.updatedAt).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'';homeCount.textContent=products.length+' strains live';updatedHome.textContent=updatedAt?'Updated '+updatedAt:'';renderCategories();const requested=new URLSearchParams(location.search).get('category'),valid=requested==='all'||products.some(p=>quality(p)===requested);if(requested&&valid)showCategory(requested,false);else showCategories(false)}).catch(()=>{homeCount.textContent='Inventory temporarily unavailable';updatedHome.textContent='';categoriesEl.innerHTML='<div class="empty" style="grid-column:1/-1">Catalog is being prepared. Please check back shortly.</div>'});
</script>
</body>
</html>
