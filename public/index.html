<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<title>Secret Menu</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#0b0b0d;color:#f7f7f8}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#17171d 0,#0b0b0d 38%,#0b0b0d 100%);min-height:100vh;color:#f7f7f8}main{max-width:1280px;margin:auto;padding:28px 18px 70px}.hero{padding:18px 0 20px}.eyebrow{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:#9b9ba7;font-weight:700}.title{font-size:clamp(34px,6vw,64px);line-height:.96;font-weight:900;margin:8px 0 10px;letter-spacing:-.035em}.sub{color:#aaaab5;font-size:15px}.controls{position:sticky;top:0;z-index:10;margin:14px 0 18px;padding:12px;background:rgba(11,11,13,.88);backdrop-filter:blur(14px);border:1px solid #26262e;border-radius:18px;display:grid;grid-template-columns:minmax(0,1fr) 220px;gap:10px}.search,.select{width:100%;padding:14px 15px;border:1px solid #303039;border-radius:13px;background:#17171c;color:#fff;font-size:15px;outline:none}.search:focus,.select:focus{border-color:#666675}.meta{font-size:13px;color:#8f8f9a;margin:0 2px 18px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}.stamp{display:inline-flex;align-items:center;padding:6px 10px;border-radius:999px;background:#1d1d23;border:1px solid #303038;font-weight:700;color:#c9c9d0}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:18px}.card{background:#151519;border:1px solid #292931;border-radius:20px;overflow:hidden;box-shadow:0 14px 45px rgba(0,0,0,.24);transition:transform .16s ease,border-color .16s ease}.card:hover{transform:translateY(-2px);border-color:#3a3a45}.media{position:relative;background:#202026}.photo{width:100%;aspect-ratio:4/3;object-fit:cover;display:block}.placeholder{aspect-ratio:4/3;display:grid;place-items:center;background:linear-gradient(135deg,#202026,#17171c);color:#686872;font-size:12px;letter-spacing:.08em;text-transform:uppercase}.badge{position:absolute;top:12px;left:12px;padding:6px 9px;border-radius:999px;background:rgba(11,11,13,.82);backdrop-filter:blur(8px);font-size:12px;font-weight:800;border:1px solid rgba(255,255,255,.12)}.qty{position:absolute;top:12px;right:12px;padding:6px 9px;border-radius:999px;background:rgba(11,11,13,.82);backdrop-filter:blur(8px);font-size:12px;border:1px solid rgba(255,255,255,.12)}.body{padding:17px}.name{font-size:20px;line-height:1.2;font-weight:850;margin-bottom:15px;min-height:48px}.prices{display:grid;gap:8px}.pricebox{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:center;padding:11px 12px;border-radius:12px;background:#1d1d23;border:1px solid #2b2b33}.plabel{font-size:12px;color:#a9a9b3}.pvalue{font-size:18px;font-weight:900;letter-spacing:-.015em}.empty{grid-column:1/-1;padding:70px 10px;text-align:center;color:#8e8e98}.fine{margin-top:26px;color:#686872;font-size:11px;text-align:center}@media(max-width:650px){main{padding:18px 12px 50px}.controls{grid-template-columns:1fr}.grid{grid-template-columns:1fr}.name{min-height:0}.title{font-size:42px}}
</style>
</head>
<body>
<main>
  <section class="hero">
    <div class="eyebrow">Private wholesale catalog</div>
    <div class="title">Secret Menu</div>
    <div class="sub">Current availability and tier pricing. Inventory refreshes automatically.</div>
  </section>

  <div class="controls">
    <input id="search" class="search" placeholder="Search strain or item..." autocomplete="off" />
    <select id="quality" class="select"><option value="">All quality levels</option></select>
  </div>

  <div id="meta" class="meta">Loading current catalog…</div>
  <div id="grid" class="grid"></div>
  <div class="fine">Availability can change between refreshes.</div>
</main>
<script>
const grid=document.getElementById('grid');
const meta=document.getElementById('meta');
const search=document.getElementById('search');
const quality=document.getElementById('quality');
let products=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function field(p,label){return (p.fields||[]).find(f=>f.label===label)?.value||''}
function prices(p){return (p.fields||[]).filter(f=>f.kind==='price')}

function render(){
  const q=search.value.trim().toLowerCase();
  const qual=quality.value;
  const list=products.filter(p=>{
    const pq=field(p,'Quality');
    return (!q||p.title.toLowerCase().includes(q)||pq.toLowerCase().includes(q))&&(!qual||pq===qual)
  });
  grid.innerHTML=list.length?list.map(p=>{
    const pq=field(p,'Quality');
    const qty=field(p,'Quantity Available');
    return `<article class="card"><div class="media">${p.image?`<img class="photo" loading="lazy" src="${esc(p.image)}" alt="${esc(p.title)}">`:`<div class="placeholder">Image unavailable</div>`}${pq?`<div class="badge">${esc(pq)}</div>`:''}${qty?`<div class="qty">${esc(qty)} lbs</div>`:''}</div><div class="body"><div class="name">${esc(p.title)}</div><div class="prices">${prices(p).map(f=>`<div class="pricebox"><div class="plabel">${esc(f.label.replace('Tier A1 Price','1–10 lbs').replace('Tier B1 Price','10–50 lbs').replace('Tier C1 Price','50+ lbs').replace(/\s*\([^)]*\)/,''))}</div><div class="pvalue">${esc(f.value)}</div></div>`).join('')}</div></div></article>`
  }).join(''):'<div class="empty">No products match those filters.</div>';
  const shown=list.length===products.length?`${products.length} products`:`${list.length} of ${products.length} products`;
  const imgs=products.filter(p=>p.image).length;
  meta.querySelector('.count')?.replaceChildren(document.createTextNode(shown));
}

search.addEventListener('input',render);quality.addEventListener('change',render);
fetch('catalog.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('catalog unavailable');return r.json()}).then(d=>{
  products=d.products||[];
  const quals=[...new Set(products.map(p=>field(p,'Quality')).filter(Boolean))].sort();
  quality.innerHTML='<option value="">All quality levels</option>'+quals.map(q=>`<option>${esc(q)}</option>`).join('');
  const when=d.updatedAt?new Date(d.updatedAt).toLocaleString():'';
  meta.innerHTML=`<span class="stamp count">${products.length} products</span>${d.imageCount!=null?`<span>${d.imageCount} photos</span>`:''}${when?`<span>Updated ${esc(when)}</span>`:''}`;
  render();
}).catch(()=>{meta.textContent='Catalog is being prepared. Please check back shortly.';grid.innerHTML='<div class="empty">No catalog data yet.</div>'});
</script>
</body>
</html>
