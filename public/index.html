<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="theme-color" content="#060606">
<title>Pounds Paradise | Pounds District</title>
<script>
if (location.hostname === 'greatergoodvision.github.io') {
  location.replace('https://menu.poundsdistrict.com/menu' + location.search + location.hash);
}
</script>
<style>
:root{--bg:#060606;--panel:#111;--line:#242424;--text:#f7f7f7;--muted:#888;--red:#e31b23;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text)}body{min-height:100vh;background:radial-gradient(circle at 85% -5%,rgba(227,27,35,.16),transparent 28%),linear-gradient(180deg,#0a0a0a,#050505 45%,#020202)}
.wrap{width:min(1500px,100%);margin:auto;padding:0 24px 70px}.top{position:sticky;top:0;z-index:20;display:flex;justify-content:space-between;align-items:center;margin:0 -24px;padding:14px 24px;background:rgba(5,5,5,.9);backdrop-filter:blur(16px);border-bottom:1px solid #181818}.brand{display:flex;gap:11px;align-items:center;text-decoration:none;color:#fff}.bar{width:5px;height:30px;border-radius:99px;background:var(--red);box-shadow:0 0 22px rgba(227,27,35,.35)}.b1{font-size:12px;font-weight:950;letter-spacing:.22em;text-transform:uppercase}.b2{margin-top:4px;font-size:9px;font-weight:800;letter-spacing:.25em;text-transform:uppercase;color:#777}.live{font-size:10px;font-weight:850;letter-spacing:.16em;text-transform:uppercase;color:#aaa}.live:before{content:"";display:inline-block;width:8px;height:8px;margin-right:8px;border-radius:50%;background:var(--red);box-shadow:0 0 16px rgba(227,27,35,.8)}
.hero{padding:42px 0 26px;border-bottom:1px solid #1b1b1b}.kick{font-size:11px;color:#ff525b;font-weight:900;letter-spacing:.25em;text-transform:uppercase;margin-bottom:12px}h1{font-size:clamp(48px,7vw,96px);line-height:.84;letter-spacing:-.06em;margin:0;font-weight:950}.rule{width:min(190px,36vw);height:5px;background:var(--red);border-radius:99px;margin-top:21px}.herofoot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;margin-top:20px;color:#888;font-size:13px}
.controls{position:sticky;top:58px;z-index:15;display:grid;grid-template-columns:1fr 240px;gap:10px;margin:18px 0 14px;padding:9px;background:rgba(14,14,14,.92);border:1px solid #222;border-radius:16px;backdrop-filter:blur(14px)}input,select{width:100%;height:48px;border-radius:11px;border:1px solid #282828;background:#090909;color:#fff;padding:0 15px;font-size:15px;outline:none}input:focus,select:focus{border-color:#7d171b}.meta{margin:0 2px 16px;color:#777;font-size:12px}
.list{display:flex;flex-direction:column;gap:11px}.card{display:grid;grid-template-columns:minmax(290px,430px) minmax(230px,1fr) minmax(300px,430px);gap:18px;align-items:center;padding:12px;border:1px solid #222;border-radius:17px;background:linear-gradient(180deg,#151515,#0e0e0e);box-shadow:0 12px 36px rgba(0,0,0,.25)}
.media-strip{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}.media-tile{position:relative;overflow:hidden;border-radius:12px;background:#111;border:1px solid #242424;aspect-ratio:4/3}.media-tile img,.media-tile video{display:block;width:100%;height:100%;object-fit:cover;background:#0a0a0a}.media-tile video{cursor:pointer}.media-tile .tag{position:absolute;left:7px;bottom:7px;padding:4px 6px;border-radius:99px;background:rgba(0,0,0,.72);border:1px solid rgba(255,255,255,.12);font-size:8px;font-weight:900;letter-spacing:.09em;text-transform:uppercase;color:#ddd;pointer-events:none}.ph{width:100%;height:100%;display:grid;place-items:center;color:#555;font-size:9px;letter-spacing:.12em;text-transform:uppercase;text-align:center;padding:8px;background:radial-gradient(circle at 50% 25%,#222,#101010 65%)}
.info{min-width:0;padding:2px 0}.name{font-size:clamp(20px,2vw,29px);line-height:1.03;font-weight:950;letter-spacing:-.025em;margin-bottom:12px}.badges{display:flex;flex-wrap:wrap;gap:7px}.badge{padding:6px 9px;border-radius:99px;background:#090909;border:1px solid #323232;font-size:9px;font-weight:900;letter-spacing:.08em;text-transform:uppercase;color:#bbb}.quality{color:#ff6b73;border-color:#5a2326}
.prices{display:grid;grid-template-columns:repeat(3,1fr);border:1px solid #242424;border-radius:12px;overflow:hidden;background:#0a0a0a}.price{padding:12px 13px;border-right:1px solid #202020}.price:last-child{border-right:0}.pl{display:block;font-size:9px;color:#737373;text-transform:uppercase;letter-spacing:.09em;font-weight:800;margin-bottom:5px}.pv{display:block;font-size:19px;font-weight:950}.empty{text-align:center;padding:70px 20px;border:1px dashed #2a2a2a;border-radius:17px;color:#707070}.foot{display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;padding-top:22px;margin-top:35px;border-top:1px solid #181818;font-size:11px;color:#646464}.foot a{color:#888;text-decoration:none}
@media(max-width:1050px){.card{grid-template-columns:minmax(260px,360px) 1fr}.prices{grid-column:2}.media-strip{grid-row:1 / span 2}.price{padding:10px}.pv{font-size:17px}}
@media(max-width:720px){.wrap{padding:0 14px 50px}.top{margin:0 -14px;padding:12px 14px}.controls{top:51px;grid-template-columns:1fr}.hero{padding-top:34px}.card{grid-template-columns:1fr;gap:12px;padding:10px}.media-strip{grid-row:auto}.info{padding:0 2px}.prices{grid-column:auto}.name{font-size:24px}.media-tile{aspect-ratio:1/1}.price{padding:10px 8px}.pl{font-size:8px}.pv{font-size:16px}}
</style>
</head>
<body>
<div class="wrap">
<header class="top"><a class="brand" href="https://menu.poundsdistrict.com/"><span class="bar"></span><span><div class="b1">Pounds District</div><div class="b2">Pounds Paradise</div></span></a><div class="live">Live Menu</div></header>
<section class="hero"><div class="kick">Private wholesale access</div><h1>LIVE MENU</h1><div class="rule"></div><div class="herofoot"><span>Current inventory. Updated automatically.</span><strong id="heroCount">Loading inventory…</strong></div></section>
<div class="controls"><input id="search" placeholder="Search inventory…" autocomplete="off"><select id="quality"><option value="">All quality</option></select></div>
<div id="meta" class="meta">Loading current catalog…</div><main id="list" class="list"></main>
<footer class="foot"><span>Availability can change between refreshes.</span><a href="https://menu.poundsdistrict.com/">← Pounds Paradise</a></footer>
</div>
<script>
const listEl=document.getElementById('list'),meta=document.getElementById('meta'),heroCount=document.getElementById('heroCount'),search=document.getElementById('search'),quality=document.getElementById('quality');let products=[];
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
const field=(p,l)=>(p.fields||[]).find(f=>f.label===l)?.value||'';
const prices=p=>(p.fields||[]).filter(f=>f.kind==='price');
const title=t=>String(t||'').replace(/\s*\([A-Z0-9-]{4,}\)\s*$/i,'').trim()||String(t||'');
const tier=l=>String(l||'').replace('Tier A1 Price','1–10 lbs').replace('Tier B1 Price','10–50 lbs').replace('Tier C1 Price','50+ lbs').replace(/\s*\([^)]*\)/,'');
function mediaFor(p){
  const media=Array.isArray(p.media)&&p.media.length?p.media:(p.image?[{type:'image',src:p.image}]:[]);
  const out=[];
  for(const m of media){if(out.length>=3)break;if(m&&m.src)out.push(m)}
  while(out.length<3)out.push(null);
  return out;
}
function mediaTile(m,i,name){
  if(!m)return `<div class="media-tile"><div class="ph">No media</div></div>`;
  if(m.type==='video') return `<div class="media-tile"><video controls muted playsinline preload="metadata" ${m.poster?`poster="${esc(m.poster)}"`:''}><source src="${esc(m.src)}"></video><span class="tag">Video</span></div>`;
  return `<div class="media-tile"><img loading="lazy" src="${esc(m.src)}" alt="${esc(name)} media ${i+1}" onerror="this.outerHTML='<div class=&quot;ph&quot;>Image unavailable</div>'"><span class="tag">Photo ${i+1}</span></div>`;
}
function render(){
  const q=search.value.trim().toLowerCase(),qual=quality.value;
  const shown=products.filter(p=>{const pq=field(p,'Quality');return(!q||(p.title+' '+title(p.title)+' '+pq).toLowerCase().includes(q))&&(!qual||pq===qual)});
  listEl.innerHTML=shown.length?shown.map(p=>{
    const pq=field(p,'Quality'),qty=field(p,'Quantity Available'),ps=prices(p),name=title(p.title),media=mediaFor(p);
    return `<article class="card"><div class="media-strip">${media.map((m,i)=>mediaTile(m,i,name)).join('')}</div><div class="info"><div class="name">${esc(name)}</div><div class="badges">${pq?`<span class="badge quality">${esc(pq)}</span>`:''}${qty?`<span class="badge">${esc(qty)} lbs available</span>`:''}${(p.media||[]).some(m=>m.type==='video')?'<span class="badge">Video</span>':''}</div></div><div class="prices">${ps.map(f=>`<div class="price"><span class="pl">${esc(tier(f.label))}</span><span class="pv">${esc(f.value)}</span></div>`).join('')}</div></article>`
  }).join(''):'<div class="empty">Nothing matches that search.</div>';
  meta.textContent=`${shown.length===products.length?products.length:shown.length+' of '+products.length} products`;
}
search.addEventListener('input',render);quality.addEventListener('change',render);
fetch('catalog.json?ts='+Date.now(),{cache:'no-store'}).then(r=>{if(!r.ok)throw 0;return r.json()}).then(d=>{
  products=d.products||[];
  const qs=[...new Set(products.map(p=>field(p,'Quality')).filter(Boolean))].sort();
  quality.innerHTML='<option value="">All quality</option>'+qs.map(q=>`<option value="${esc(q)}">${esc(q)}</option>`).join('');
  heroCount.textContent=`${products.length} products live`;
  const media=d.mediaCount??products.reduce((n,p)=>n+(p.media?.length||0),0),videos=d.videoCount??products.reduce((n,p)=>n+(p.media||[]).filter(m=>m.type==='video').length,0),when=d.updatedAt?new Date(d.updatedAt).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'';
  meta.textContent=`${products.length} products • ${media} media${videos?' • '+videos+' videos':''}${when?' • Updated '+when:''}`;
  render();
}).catch(()=>{heroCount.textContent='Inventory temporarily unavailable';meta.textContent='Catalog unavailable';listEl.innerHTML='<div class="empty">Please check back shortly.</div>'});
</script>
</body>
</html>
