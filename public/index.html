<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<meta name="robots" content="noindex,nofollow,noarchive" />
<meta name="theme-color" content="#070807" />
<title>Pounds Paradise — Live Menu</title>
<style>
:root{
  --bg:#070807;
  --panel:#10110f;
  --panel2:#151613;
  --line:rgba(255,255,255,.09);
  --text:#f6f1e6;
  --muted:#9d9b92;
  --gold:#d4a85b;
  --gold2:#f0d194;
  --shadow:0 22px 60px rgba(0,0,0,.42);
  font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0;
  min-height:100vh;
  color:var(--text);
  background:
    radial-gradient(circle at 78% -8%,rgba(212,168,91,.13),transparent 26%),
    radial-gradient(circle at 20% 0,rgba(29,72,75,.15),transparent 28%),
    linear-gradient(180deg,#0a0b09 0%,#070807 42%,#050605 100%);
}
a{color:inherit}
.wrap{width:min(1440px,100%);margin:0 auto;padding:0 26px 80px}
.topbar{
  position:sticky;top:0;z-index:30;
  display:flex;align-items:center;justify-content:space-between;gap:20px;
  margin:0 -26px;padding:18px 26px;
  background:rgba(7,8,7,.78);backdrop-filter:blur(18px) saturate(140%);
  border-bottom:1px solid rgba(255,255,255,.06);
}
.brand{font-size:13px;font-weight:900;letter-spacing:.22em;text-transform:uppercase;text-decoration:none}
.live{display:flex;align-items:center;gap:9px;font-size:12px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#c7c2b7}
.dot{width:8px;height:8px;border-radius:999px;background:var(--gold);box-shadow:0 0 18px rgba(212,168,91,.8)}
.hero{padding:64px 0 34px;border-bottom:1px solid rgba(255,255,255,.07)}
.kicker{font-size:11px;font-weight:900;letter-spacing:.26em;text-transform:uppercase;color:var(--gold2);margin-bottom:16px}
h1{font-size:clamp(52px,9vw,132px);line-height:.82;letter-spacing:-.07em;margin:0;font-weight:950;max-width:1000px}
.herofoot{display:flex;justify-content:space-between;align-items:end;gap:24px;margin-top:32px;color:var(--muted);font-size:14px}
.herofoot strong{color:var(--text);font-weight:800}
.controls{
  position:sticky;top:57px;z-index:20;
  display:grid;grid-template-columns:minmax(0,1fr) 250px;gap:10px;
  margin:24px 0 14px;padding:10px;
  border:1px solid var(--line);border-radius:18px;
  background:rgba(15,16,14,.88);backdrop-filter:blur(16px);
  box-shadow:0 12px 40px rgba(0,0,0,.18)
}
.search,.select{
  appearance:none;width:100%;height:52px;padding:0 16px;
  border:1px solid rgba(255,255,255,.08);border-radius:12px;
  color:var(--text);background:#0b0c0a;font-size:15px;outline:none;
  transition:border-color .18s ease,background .18s ease
}
.search::placeholder{color:#68675f}.search:focus,.select:focus{border-color:rgba(212,168,91,.55);background:#10110e}
.meta{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:0 2px 22px;color:#7f7d75;font-size:12px}
.meta .count{color:var(--text);font-weight:850}.sep{opacity:.45}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px}
.card{
  position:relative;overflow:hidden;border-radius:18px;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid rgba(255,255,255,.08);box-shadow:var(--shadow);
  transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease
}
.card:hover{transform:translateY(-3px);border-color:rgba(212,168,91,.28);box-shadow:0 26px 75px rgba(0,0,0,.5)}
.media{position:relative;background:#151613;overflow:hidden}
.photo{display:block;width:100%;aspect-ratio:4/3;object-fit:cover;transition:transform .35s ease;filter:saturate(.94) contrast(1.03)}
.card:hover .photo{transform:scale(1.018)}
.placeholder{aspect-ratio:4/3;display:grid;place-items:center;background:radial-gradient(circle at 50% 28%,#24231e,#11120f 64%);color:#615f57;font-size:10px;letter-spacing:.18em;text-transform:uppercase}
.badges{position:absolute;inset:12px 12px auto 12px;display:flex;justify-content:space-between;gap:8px;pointer-events:none}
.badge,.qty{padding:7px 10px;border-radius:999px;background:rgba(5,6,5,.78);backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.12);font-size:10px;font-weight:900;letter-spacing:.08em;text-transform:uppercase}
.badge{color:var(--gold2)}.qty{color:#eee9dc}
.body{padding:18px 18px 17px}
.name{font-size:19px;line-height:1.08;font-weight:900;letter-spacing:-.025em;min-height:42px;margin-bottom:18px}
.prices{border-top:1px solid rgba(255,255,255,.08)}
.pricebox{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:11px 0;border-bottom:1px solid rgba(255,255,255,.065)}
.pricebox:last-child{border-bottom:0;padding-bottom:0}
.plabel{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#75736c;font-weight:800}
.pvalue{font-size:18px;font-weight:950;letter-spacing:-.02em;color:#fff7e8}
.empty{grid-column:1/-1;padding:100px 20px;text-align:center;color:#77756d;border:1px dashed rgba(255,255,255,.1);border-radius:18px}
.footer{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-top:36px;padding-top:22px;border-top:1px solid rgba(255,255,255,.06);font-size:11px;color:#64625c}
.footer a{text-decoration:none;color:#8e8b82}.footer a:hover{color:var(--gold2)}
@media(max-width:1100px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}
@media(max-width:820px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.herofoot{align-items:flex-start;flex-direction:column}.controls{grid-template-columns:1fr 210px}}
@media(max-width:620px){
  .wrap{padding:0 14px 54px}.topbar{margin:0 -14px;padding:15px 14px}.brand{font-size:11px}.live{font-size:10px}
  .hero{padding:44px 0 25px}h1{font-size:clamp(50px,18vw,88px);line-height:.83}.herofoot{margin-top:24px}
  .controls{top:49px;margin-top:16px;grid-template-columns:1fr;padding:8px;border-radius:15px}.search,.select{height:48px}
  .grid{grid-template-columns:1fr;gap:14px}.name{min-height:0;font-size:21px}.body{padding:17px}.footer{align-items:flex-start;flex-direction:column}
}
</style>
</head>
<body>
<div class="wrap">
  <header class="topbar">
    <a class="brand" href="https://poundsdistrict.com/poundsparadise">Pounds Paradise</a>
    <div class="live"><span class="dot"></span>Live Menu</div>
  </header>

  <section class="hero">
    <div class="kicker">Private wholesale access</div>
    <h1>LIVE<br>MENU</h1>
    <div class="herofoot">
      <div>Current inventory. <strong>Updated automatically.</strong></div>
      <div id="heroCount">Loading inventory…</div>
    </div>
  </section>

  <div class="controls">
    <input id="search" class="search" placeholder="Search inventory…" autocomplete="off" inputmode="search" />
    <select id="quality" class="select" aria-label="Filter by quality"><option value="">All quality</option></select>
  </div>

  <div id="meta" class="meta">Loading current catalog…</div>
  <div id="grid" class="grid"></div>

  <footer class="footer">
    <span>Availability can change between refreshes.</span>
    <a href="https://poundsdistrict.com/poundsparadise">← Back to Pounds Paradise</a>
  </footer>
</div>
<script>
const grid=document.getElementById('grid');
const meta=document.getElementById('meta');
const heroCount=document.getElementById('heroCount');
const search=document.getElementById('search');
const quality=document.getElementById('quality');
let products=[];

function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function field(p,label){return (p.fields||[]).find(f=>f.label===label)?.value||''}
function prices(p){return (p.fields||[]).filter(f=>f.kind==='price')}
function displayTitle(title){return String(title||'').replace(/\s*\([A-Z0-9-]{4,}\)\s*$/i,'').trim()||String(title||'')}
function tierLabel(label){
  return String(label||'')
    .replace('Tier A1 Price','1–10 lbs')
    .replace('Tier B1 Price','10–50 lbs')
    .replace('Tier C1 Price','50+ lbs')
    .replace(/\s*\([^)]*\)/,'');
}
function imageMarkup(p){
  if(!p.image)return '<div class="placeholder">Image unavailable</div>';
  return `<img class="photo" loading="lazy" src="${esc(p.image)}" alt="${esc(displayTitle(p.title))}" onerror="this.outerHTML='<div class=&quot;placeholder&quot;>Image unavailable</div>'">`;
}
function render(){
  const q=search.value.trim().toLowerCase();
  const qual=quality.value;
  const list=products.filter(p=>{
    const pq=field(p,'Quality');
    const hay=(p.title+' '+displayTitle(p.title)+' '+pq).toLowerCase();
    return (!q||hay.includes(q))&&(!qual||pq===qual);
  });
  grid.innerHTML=list.length?list.map(p=>{
    const pq=field(p,'Quality');
    const qty=field(p,'Quantity Available');
    const ps=prices(p);
    return `<article class="card">
      <div class="media">
        ${imageMarkup(p)}
        <div class="badges">${pq?`<div class="badge">${esc(pq)}</div>`:'<span></span>'}${qty?`<div class="qty">${esc(qty)} lbs</div>`:''}</div>
      </div>
      <div class="body">
        <div class="name">${esc(displayTitle(p.title))}</div>
        <div class="prices">${ps.map(f=>`<div class="pricebox"><div class="plabel">${esc(tierLabel(f.label))}</div><div class="pvalue">${esc(f.value)}</div></div>`).join('')}</div>
      </div>
    </article>`;
  }).join(''):'<div class="empty">Nothing matches that search.</div>';

  const shown=list.length===products.length?`${products.length} products`:`${list.length} of ${products.length} products`;
  const count=meta.querySelector('.count');
  if(count)count.textContent=shown;
}
search.addEventListener('input',render);
quality.addEventListener('change',render);

fetch('catalog.json?ts='+Date.now(),{cache:'no-store'})
  .then(r=>{if(!r.ok)throw new Error('catalog unavailable');return r.json()})
  .then(d=>{
    products=d.products||[];
    const quals=[...new Set(products.map(p=>field(p,'Quality')).filter(Boolean))].sort();
    quality.innerHTML='<option value="">All quality</option>'+quals.map(q=>`<option value="${esc(q)}">${esc(q)}</option>`).join('');
    const when=d.updatedAt?new Date(d.updatedAt).toLocaleString([], {dateStyle:'medium',timeStyle:'short'}):'';
    const imgs=products.filter(p=>p.image).length;
    heroCount.textContent=`${products.length} products live`;
    meta.innerHTML=`<span class="count">${products.length} products</span><span class="sep">•</span><span>${imgs} photos</span>${when?`<span class="sep">•</span><span>Updated ${esc(when)}</span>`:''}`;
    render();
  })
  .catch(()=>{
    heroCount.textContent='Inventory temporarily unavailable';
    meta.textContent='Catalog is being prepared. Please check back shortly.';
    grid.innerHTML='<div class="empty">No catalog data yet.</div>';
  });
</script>
</body>
</html>
